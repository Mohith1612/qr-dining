# Redocly lint configuration for the qr-dining OpenAPI contract.
# Run:  npx @redocly/cli lint openapi.yaml
#
# We extend the built-in "recommended" ruleset so all structural-correctness
# checks (broken $refs, missing/duplicate schemas, invalid 3.1 constructs) stay
# enforced as ERRORS. A few opinionated rules are tuned to match deliberate
# choices in this API; everything else keeps its recommended severity.
extends:
  - recommended

rules:
  # Internal API contract — no public license to declare.
  info-license: off

  # `/tables/by-qr/{token}` and `/tables/{id}/qr-refresh` overlap as templates,
  # but this mirrors the ACTUAL Gin routes (the static `by-qr` segment wins at
  # runtime). The spec faithfully documents the real surface; renaming routes is
  # out of scope for this certification.
  no-ambiguous-paths: off

  # Informational only: a handful of infra/read/logout operations legitimately
  # return just 2xx (e.g. /health, /metrics, /plans, logout 204). Kept as a
  # warning rather than an error so it never blocks certification.
  operation-4xx-response: warn

  # operationId is not required for a hand-authored contract used as a manual
  # testing reference; suppress the suggestion noise.
  operation-operationId: off

  # The single server is the real local dev target (http://localhost:8080); this
  # contract is used for local/staging manual testing, so localhost is correct.
  no-server-example.com: off

  # `GET /ws` performs a WebSocket upgrade and returns 101 (no 2xx by design).
  operation-2xx-response: off

apis:
  qr-dining@v2:
    root: openapi.yaml
