# Alertmanager configuration for qr-dining.
#
# GO-LIVE: change exactly ONE line — the &notify_url anchor in the `default`
# receiver below. Both receivers alias it, so pointing it at a real webhook
# (Slack relay, Teams, PagerDuty relay, etc.) activates all routing. Severity
# ("page" vs "ticket") is carried in the webhook payload; the page route only
# differs in repeat cadence. Native Slack/email/PagerDuty examples remain
# commented below if a native integration is ever preferred over a webhook.
#
# `page` severity → urgent receiver (short repeat); everything else → default.

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "page"
      receiver: urgent
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      # >>> THE go-live line. Replace with the real notification endpoint. <<<
      # (This is a placeholder, not a human receiver — see docs/OPERATIONS.md.)
      - url: &notify_url "http://CHANGEME-notify-endpoint:5001/alerts"
        send_resolved: true

  - name: urgent
    webhook_configs:
      - url: *notify_url
        send_resolved: true

    # --- Native Slack (uncomment and use instead of webhook_configs) ---
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
    #     channel: "#qr-dining-alerts"
    #     send_resolved: true
    #     title: '{{ .CommonAnnotations.summary }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

    # --- Native email ---
    # email_configs:
    #   - to: "oncall@yourdomain.com"
    #     from: "alerts@yourdomain.com"
    #     smarthost: "smtp.yourprovider.com:587"
    #     auth_username: "alerts@yourdomain.com"
    #     auth_password: "CHANGE_ME"
    #     send_resolved: true

    # --- Native PagerDuty ---
    # pagerduty_configs:
    #   - routing_key: "CHANGE_ME"
    #     send_resolved: true

# Suppress lower-severity noise for an alert that is already paging.
inhibit_rules:
  - source_matchers: [severity = "page"]
    target_matchers: [severity = "ticket"]
    equal: ["alertname"]
