# Alertmanager configuration for qr-dining.
#
# Routes Prometheus alerts to real notifications. The default receiver is a
# generic webhook (the most portable option — it fronts Slack, Teams, PagerDuty,
# Opsgenie, or a small relay). Native Slack/email/PagerDuty examples are included
# commented below; pick one and set it as the receiver.
#
# `page` severity → urgent receiver (short repeat); everything else → default.

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "page"
      receiver: urgent
      repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      # Replace with your chat/relay webhook URL. For the verification run this is
      # pointed at a local sink (see alerting-setup.md).
      - url: "http://webhook-sink:5001/default"
        send_resolved: true

  - name: urgent
    webhook_configs:
      - url: "http://webhook-sink:5001/urgent"
        send_resolved: true

    # --- Native Slack (uncomment and use instead of webhook_configs) ---
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
    #     channel: "#qr-dining-alerts"
    #     send_resolved: true
    #     title: '{{ .CommonAnnotations.summary }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

    # --- Native email ---
    # email_configs:
    #   - to: "oncall@yourdomain.com"
    #     from: "alerts@yourdomain.com"
    #     smarthost: "smtp.yourprovider.com:587"
    #     auth_username: "alerts@yourdomain.com"
    #     auth_password: "CHANGE_ME"
    #     send_resolved: true

    # --- Native PagerDuty ---
    # pagerduty_configs:
    #   - routing_key: "CHANGE_ME"
    #     send_resolved: true

# Suppress lower-severity noise for an alert that is already paging.
inhibit_rules:
  - source_matchers: [severity = "page"]
    target_matchers: [severity = "ticket"]
    equal: ["alertname"]
