# Prometheus config for qr-dining. Scrapes the app, the /readyz blackbox probe,
# and node_exporter (for the backup textfile metric); loads the alert rules; and
# forwards firing alerts to Alertmanager.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # `app2` exists only when a multi-instance overlay is in use (the beta
  # deployment runs two backends against one Postgres/Redis to exercise Redis
  # pub/sub fan-out). Prometheus logs a resolution failure for a target that
  # isn't running and carries on scraping the rest, so listing both here is
  # safe for single-instance deployments too.
  - job_name: qr-dining
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
        labels: {instance_name: app-1}
      - targets: ["app2:8080"]
        labels: {instance_name: app-2}

  # Authoritative dependency-outage signal: /readyz returns 503 when Postgres or
  # Redis is down (Phase D F-1). probe_success==0 => a datastore is unavailable.
  - job_name: qr-dining-readyz
    metrics_path: /probe
    params:
      module: [readyz_http_2xx]
    #
    # instance_name mirrors the label on the qr-dining job on purpose: it is the
    # ONLY label the two jobs share, and Alertmanager needs it to join
    # AppTargetDown (instance="app2:8080") to ReadyzProbeFailing
    # (instance="http://app2:8080/readyz") when deciding what to inhibit.
    # Without it the inhibition has to be global, and one instance going down
    # silences the readiness page for the other — which on a two-instance
    # deployment is exactly backwards.
    static_configs:
      - targets: ["http://app:8080/readyz"]
        labels: {instance_name: app-1}
      - targets: ["http://app2:8080/readyz"]
        labels: {instance_name: app-2}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # node_exporter with the textfile collector exposes the nightly backup metric
  # (qr_dining_backup_*) written by nightly-backup.sh.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # The alerting pipeline watching itself. Everything above this line observes
  # the application; nothing observed the two processes that carry the alerts.
  #
  # The dead man's switch covers TOTAL failure of either process (the pings
  # stop). These two jobs cover the partial failures it cannot see: Telegram
  # rejecting messages while Alertmanager is otherwise healthy, and a rule that
  # errors on every evaluation while Prometheus keeps running. Both of those
  # look exactly like "no alerts today".
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Self-scrape. `up{job="prometheus"}` is trivially 1 and proves nothing — the
  # point is prometheus_rule_evaluation_failures_total and
  # prometheus_notifications_errors_total, i.e. "am I still evaluating rules,
  # and are they still reaching Alertmanager".
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
