# qr-dining BETA vhost for the CENTRAL reverse proxy.
#
# THIS FILE IS MOUNTED, NOT COPIED. proxy_nginx bind-mounts the directory that
# contains it — /opt/qr-dining/repo/deploy/vm/nginx — read-only at
# /etc/nginx/qr-dining.d, and /opt/proxy/nginx/conf.d/qr-dining-beta.conf is a
# three-line stub that includes it (deploy/vm/proxy-nginx-mount.md). So:
#
#     git log -1 -- deploy/vm/nginx/   answers "what routing is running?"
#     git pull                         is the deploy
#
# It used to be a hand-copy of a .conf.example. A copy carries no provenance —
# on 2026-09-18 the live file happened to be byte-identical to the example, but
# nothing on the box could prove that, and the same class of drift had already
# cost three days of missing alert rules (docs/OPERATIONS.md, "Keeping the VM in
# step with the repo").
#
# A DIRECTORY is mounted, not this file, and that is deliberate. A single-file
# bind mount pins the inode it was created with; `git checkout` replaces files
# rather than rewriting them, so the container keeps serving content that no
# longer exists on disk. Reproduced on the VM — see docs/OPERATIONS.md, "Why the
# nginx mount is a directory". A directory mount resolves each lookup fresh.
#
# WHAT THIS MEANS WHEN YOU EDIT IT: this file now reaches a SHARED proxy that
# also fronts grafana, job-queue and sketchiple. A syntax error here is their
# outage too, and it arrives via `git pull`, not via a copy you were watching.
# deploy/vm/deploy.sh runs `nginx -t` after every fast-forward and reverts the
# checkout rather than reloading a config that fails it. Never reload by hand
# without `nginx -t` first.
#
# Beta-specific facts (this deployment, not the production template in
# deploy/vm/qr-dining.conf.example, which keeps its CHANGEME placeholders):
#   * concrete hostnames on mohith16.com
#   * the existing WILDCARD cert (*.mohith16.com, DNS-01 via dns-cloudflare)
#     rather than a per-host cert — no issuance is required for these names
#   * routes across TWO backend instances (see the upstream section below)
#
# WebSocket/idle note: the app pings every ~54s, so proxy_read_timeout on /ws
# must stay well above that (3600s here). qr-api-beta is DNS-only (grey cloud)
# in Cloudflare, so there is no CF edge idle window to satisfy and nginx sees
# real client IPs — which is what makes the per-IP rate limiting below
# meaningful during certification. Do not lower these timeouts.

# Prefixed qr_ to avoid collisions with the other projects' vhosts on this
# shared proxy (grafana/job-queue/sketchiple each define their own).
map $http_upgrade $qr_connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP limiter for the HTTP API surface. WebSocket upgrades are exempt — the
# app enforces ws-ticket issuance and per-connection inbound limits itself.
limit_req_zone $binary_remote_addr zone=qr_api:10m rate=30r/s;

# ---------- upstream selection ----------
#
# The beta runs two backend instances against one Postgres and one Redis, so
# cross-instance behaviour (Redis pub/sub fan-out, WS ticket portability,
# background-worker coordination) is certifiable rather than assumed.
#
# There is deliberately NO upstream{} block. nginx resolves upstream hostnames
# at CONFIG LOAD time, so if the qr-dining containers were down, this SHARED
# proxy would fail to load and block config reloads for every other project on
# the VM. Keeping the target in a variable defers DNS to request time via the
# docker resolver, so the proxy stays healthy regardless of this app's state.
# That property is worth more than what an upstream{} block would buy, so the
# balancing is done with split_clients instead.
split_clients "${remote_addr}" $qr_upstream_split {
    50%     qr_dining_app:8080;
    *       qr_dining_app_2:8080;
}

# Hashing on the client address means a given device keeps the same instance
# across reconnects (matching a sticky-LB assumption), while different devices
# spread across both. The -1/-2 hostnames pin a device to a chosen instance so
# cross-instance tests are deterministic instead of a coin flip.
map $host $qr_upstream {
    qr-api-beta-1.mohith16.com  qr_dining_app:8080;
    qr-api-beta-2.mohith16.com  qr_dining_app_2:8080;
    default                     $qr_upstream_split;
}

# ---------- failover ----------
#
# split_clients gives no automatic failover: whichever instance a client IP
# hashes to is the only one it will ever reach. The original version of this
# file said so and left it ("Revisit before production"), on the grounds that
# instance loss becoming an explicit test was useful.
#
# A rolling deploy makes that untenable. The whole point of restarting one
# instance at a time is that the other keeps serving — but with a pure
# split_clients map, the ~50% of client IPs hashed to the restarting instance
# get 502s for the duration anyway. The rolling restart would be theatre.
#
# So: one retry against the OTHER instance, and only when nginx itself could not
# reach the first (connect refused / no host / upstream timeout). Note what is
# deliberately absent — proxy_intercept_errors. Without it, error_page only sees
# errors NGINX generated, never a 5xx the application chose to return. A 503
# from /readyz, or a 500 from a handler, is the app's answer and is passed
# through untouched; retrying those on the second instance would turn one user's
# error into two instances' load and hide the failure from the health gate.
map $qr_upstream_split $qr_failover_split {
    qr_dining_app:8080  qr_dining_app_2:8080;
    default             qr_dining_app:8080;
}

# The pinned -1/-2 hostnames must NOT fail over: their entire purpose is that
# "which instance answered?" has a known answer. They map to themselves, so the
# retry hits the same dead instance and the client gets an honest 502.
map $host $qr_failover {
    qr-api-beta-1.mohith16.com  qr_dining_app:8080;
    qr-api-beta-2.mohith16.com  qr_dining_app_2:8080;
    default                     $qr_failover_split;
}

# ---------- HTTP: ACME challenge + redirect ----------
server {
    listen 80;
    server_name qr-api-beta.mohith16.com qr-api-beta-1.mohith16.com qr-api-beta-2.mohith16.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    server_name qr-api-beta.mohith16.com qr-api-beta-1.mohith16.com qr-api-beta-2.mohith16.com;

    # Wildcard cert already covering *.mohith16.com — shared with the other
    # vhosts on this proxy. Renewed via DNS-01 (dns-cloudflare), NOT webroot.
    ssl_certificate     /etc/letsencrypt/live/mohith16.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mohith16.com/privkey.pem;

    # Docker service-name DNS for the proxy network; request-time resolution.
    resolver 127.0.0.11 valid=30s;

    # The app reads X-Forwarded-For via gin trusted proxies (TRUSTED_PROXIES in
    # /opt/qr-dining/.env) — keep that set to the docker proxy network CIDR.
    #
    # ⚠ These server-level headers are inherited by a location ONLY IF that
    # location sets no proxy_set_header of its own. nginx REPLACES the whole
    # set at the more specific level rather than merging it. Any location below
    # that needs its own header must therefore repeat all four, or the app
    # silently sees the nginx container as the client — which collapses every
    # guest into one rate-limit bucket and puts the proxy IP in the audit log.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket endpoint — long-lived, unbuffered, unthrottled.
    location = /ws {
        proxy_pass http://$qr_upstream;
        proxy_http_version 1.1;

        # Repeated deliberately — see the note above.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $qr_connection_upgrade;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Probes — unthrottled.
    #
    # These DO fail over, and the $qr_failover map is what makes that safe. On
    # the service hostname a probe is asking "is the service up?", so answering
    # from the surviving instance is the correct answer — without this, every
    # rolling deploy would 502 half the external uptime monitor's checks and
    # page for a deploy that was working. On the pinned -1/-2 hostnames the map
    # sends the retry back to the SAME instance, so "which instance answered?"
    # still has a known answer and a dead instance still reports 502.
    #
    # The deploy health gate does not rely on this either way: it probes the
    # container's own address on the internal network, precisely so that nginx
    # cannot answer for a container that never came up
    # (deploy/vm/deploy.sh, health_gate).
    #
    # ⚠ access_log off COSTS AN EVENING EVERY TIME SOMEBODY FORGETS IT IS HERE.
    # Blackbox, the external uptime monitor and deploy/vm/deploy.sh all hit these
    # paths constantly, and the noise would bury real traffic. The price is that
    # `docker logs proxy_nginx` shows NOTHING for a probe — a /readyz that never
    # arrives and a /readyz that 200s look identical from the proxy log. When a
    # probe misbehaves, read the app log, not the proxy log:
    #     docker logs --since 10m qr_dining_app | grep readyz
    # docs/OPERATIONS.md, "How a request reaches the app", has the full path.
    location = /health {
        access_log off;
        proxy_pass http://$qr_upstream;
        error_page 502 504 = @qr_retry_other_instance;
    }
    location = /readyz {
        access_log off;
        proxy_pass http://$qr_upstream;
        error_page 502 504 = @qr_retry_other_instance;
    }

    # Prometheus metrics — never public. Prometheus runs on the same host and
    # scrapes both app containers directly over the docker network, so the only
    # legitimate HTTP path to /metrics is local debugging.
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://$qr_upstream;
    }

    # All other API traffic.
    location / {
        limit_req zone=qr_api burst=60 nodelay;
        proxy_pass http://$qr_upstream;
        proxy_http_version 1.1;

        # Repeated deliberately — setting Connection below would otherwise
        # discard the server-level set. See the note above.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_read_timeout 30s;

        # Only 502/504: errors nginx raised because it could not reach the
        # instance. See the failover section above for why 503 is not here.
        error_page 502 504 = @qr_retry_other_instance;
    }

    # One retry against the other instance. This location sets no error_page of
    # its own and named locations do not inherit `location /`'s, so a second
    # failure is returned to the client — there is no retry loop.
    location @qr_retry_other_instance {
        proxy_pass http://$qr_failover;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
