# qr-dining — production compose for the shared OCI VM.
#
# This file follows the VM Project Deployment Reference (central /opt/proxy
# nginx+certbot, shared external docker network "proxy", per-project directory).
# It is the file that lands at /opt/qr-dining/docker-compose.yml, alongside a
# root-only .env written from deploy/vm/.env.production.example.
#
# Deliberate deviations from the VM reference defaults:
#   * postgres:17-alpine (not 16) — the app, its 40 migrations, and the restore
#     certification are all validated against Postgres 17. Do not downgrade.
#   * The app image is arm64-only (backend/docker/Dockerfile hardcodes GOARCH);
#     this VM is Ampere arm64, so `docker compose pull` just works.
#
# Deploy pattern (see docs/OPERATIONS.md):
#   cd /opt/qr-dining && docker compose pull && docker compose up -d
#
# NOTE for local development machines: do NOT run this file locally. The local
# repo checkout also hosts the long-running soak stack under the compose project
# name `qr-dining`; production bring-up happens only on the VM.

name: qr-dining

# Docker's default json-file driver grows without bound. On a shared VM that is
# eventually somebody else's outage, so every service below caps its logs.
# Keep max-file generous enough that SigNoz's filelog receiver (which tails
# these very files) doesn't lose records across a rotation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  proxy:
    external: true # shared nginx network — created once by /opt/proxy
  qr-dining_internal:
    internal: true # postgres/redis are invisible to nginx and the internet

volumes:
  qr-dining_postgres_data:
  qr-dining_redis_data:

services:
  app:
    image: ghcr.io/mohith1612/qr-dining:${IMAGE_TAG:-latest}
    container_name: qr_dining_app
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy
      - qr-dining_internal
    expose:
      - "8080"
    # Shared VM: cap memory so a leak cannot starve the other projects.
    mem_limit: 1g
    healthcheck:
      # /readyz returns 503 when Postgres or Redis is unreachable, so the
      # container is "healthy" only when it can actually serve.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    container_name: qr_dining_postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - qr-dining_postgres_data:/var/lib/postgresql/data
    networks:
      - qr-dining_internal
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: qr_dining_redis
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - qr-dining_redis_data:/data
    networks:
      - qr-dining_internal
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
