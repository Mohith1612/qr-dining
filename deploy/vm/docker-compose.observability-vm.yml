# qr-dining — VM overlay for the observability stack.
#
# The base observability compose (deploy/observability/) defines its own bridge
# network only; standalone, prometheus/blackbox cannot resolve the app. This
# overlay joins them to the app's internal network so `app:8080` resolves, and
# binds the Prometheus/Alertmanager UIs to localhost only (shared VM — reach
# them via SSH tunnel, never the public interface).
#
# Layout on the VM (see DEPLOYMENT.md):
#   /opt/qr-dining/docker-compose.yml                          (deploy/vm/docker-compose.yml)
#   /opt/qr-dining/observability/                              (copy of deploy/observability/)
#   /opt/qr-dining/docker-compose.observability-vm.yml         (this file)
#
# Run everything as ONE compose project from /opt/qr-dining:
#   docker compose -f docker-compose.yml \
#                  -f observability/docker-compose.observability.yml \
#                  -f docker-compose.observability-vm.yml up -d

services:
  prometheus:
    networks:
      - observability
      - qr-dining_internal
    # `!override` replaces (not appends) the base port mapping. Requires
    # docker compose v2.24+.
    ports: !override
      - "127.0.0.1:9090:9090"

  alertmanager:
    ports: !override
      - "127.0.0.1:9093:9093"

  blackbox:
    networks:
      - observability
      - qr-dining_internal
