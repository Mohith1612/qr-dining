# qr-dining — BETA overlay for the shared OCI VM.
#
# Everything beta-specific lives here so deploy/vm/docker-compose.yml keeps its
# single-app production shape untouched. Apply as an overlay, never alone:
#
#   cd /opt/qr-dining
#   docker compose -f docker-compose.yml -f docker-compose.beta.yml up -d
#
# It does three things:
#
#   1. Gives app2 the same image reference as app.
#
#      This used to pin both backends to a LOCALLY BUILT qr-dining:beta-<sha>
#      with pull_policy: never, because the beta deployed an unmerged branch and
#      ghcr.io/mohith1612/qr-dining had never been published. Both halves of that
#      are now false: main is the pilot branch, and CI pushes
#      ghcr.io/mohith1612/qr-dining:sha-<short> on every merge to main. Pinning
#      to a local build meant six weeks of merged fixes sat in a registry nobody
#      pulled from — the box ran beta-b57f746, a pre-audit commit, for 5 weeks.
#
#      Both services now resolve ${IMAGE_REPO}:${IMAGE_TAG} from the base file,
#      which deploy/vm/deploy.sh writes into /opt/qr-dining/.env. The principle
#      the old comment was defending still holds and is now expressed by
#      IMAGE_REPO: a local image keeps a local name (IMAGE_REPO=qr-dining) so it
#      can never be mistaken for something a registry vouched for.
#
#   2. Adds a SECOND backend instance (app2) sharing one Postgres and one Redis.
#      A single instance cannot certify Redis pub/sub fan-out, WebSocket ticket
#      portability, staff-session portability, or background-worker coordination
#      — a whole class of bug that only appears with more than one process. The
#      manual-certification checklist has cross-instance tests; this is what
#      makes them runnable outside the laptop stack's :8090/:8095 pair.
#
#   3. Joins both to the external `signoz` network so they can reach
#      signoz-otel-collector:4317 (see deploy/signoz/README.md).
#
# FIRST BOOT ONLY: start `app` alone, let it apply the embedded migrations, and
# only then start `app2` — two containers racing the same migrations against an
# empty database is a risk worth not taking once:
#   docker compose -f docker-compose.yml -f docker-compose.beta.yml up -d app
#   # wait for healthy, confirm schema v40, then:
#   docker compose -f docker-compose.yml -f docker-compose.beta.yml up -d
# Migrations are idempotent, so later restarts can bring both up together.
#
# ROUTINE DEPLOYS DO NOT USE THIS FILE BY HAND. deploy/vm/deploy.sh drives the
# same two files with --project-directory /opt/qr-dining, one service at a time,
# with a health gate between them. Running `up -d` yourself restarts both
# instances simultaneously, which is the downtime the rolling path exists to
# avoid. docs/OPERATIONS.md, "Automatic deployment".

networks:
  signoz:
    external: true

services:
  app:
    environment:
      GIN_MODE: release
      # MUST match app2. WORKER_REGION is not an instance label — it is the
      # background workers' coordination domain: internal/worker/worker.go
      # locks on "worker:<region>:<name>:lock" in Redis, so two instances with
      # DIFFERENT regions take different locks and both run every sweep
      # (duplicate payment escalations, duplicate reactivation transitions).
      # scripts/manual-testing-up.sh uses mtest-1/mtest-2 because it is
      # deliberately simulating two regions; an HA pair is one region.
      # Per-instance identity for logs/metrics comes from the container name
      # and Prometheus' instance_name label instead.
      WORKER_REGION: beta
    networks:
      - proxy
      - qr-dining_internal
      - signoz

  app2:
    # Must stay identical to app's reference — a rolling deploy that left the
    # two instances on different images would be a silent split-brain, not a
    # deploy. deploy/vm/deploy.sh asserts both containers end on the same image
    # ID before it reports success.
    image: ${IMAGE_REPO:-ghcr.io/mohith1612/qr-dining}:${IMAGE_TAG:-latest}
    container_name: qr_dining_app_2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      GIN_MODE: release
      WORKER_REGION: beta # must equal app's — see the note above
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proxy
      - qr-dining_internal
      - signoz
    expose:
      - "8080"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
