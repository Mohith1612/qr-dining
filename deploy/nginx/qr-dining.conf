# qr-dining reverse proxy — websocket-aware.
#
# Terminates client traffic and proxies to the Go app (service name `app` on the
# shared docker `proxy` network, listening on :8080). TLS is expected to be
# terminated upstream (Cloudflare / load balancer); this config assumes it
# receives plain HTTP on :80 behind that edge and forwards X-Forwarded-* set by
# the edge.
#
# Cloudflare note: Cloudflare proxies WebSockets over the 101 upgrade and applies
# an idle timeout (~100s on standard plans). The app's writePump sends a server
# ping every ~54s (pingPeriod), which is below that window, so idle WS sessions
# stay alive without client traffic. Do NOT lower proxy_read_timeout below that.

# Maps the Upgrade request header to the Connection response header so that only
# genuine upgrade requests get "Connection: upgrade"; everything else gets "".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP request limiter for the HTTP API surface. WebSocket upgrades are NOT
# subject to this zone — a reconnect storm must not be throttled here (the app
# enforces ws-ticket issuance limits and per-connection inbound limits instead).
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

upstream qr_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Trust the edge's forwarded client IP. The app reads X-Forwarded-For via
    # gin trusted proxies (TRUSTED_PROXIES); keep these consistent.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade endpoint. Long-lived; buffering off so server pushes are
    # flushed immediately. No rate limiting on this location.
    location = /ws {
        proxy_pass http://qr_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering    off;
        proxy_read_timeout 3600s;   # well above the 54s server ping interval
        proxy_send_timeout 3600s;
    }

    # Liveness/readiness probes — pass through unthrottled, no logging noise.
    location = /health {
        access_log off;
        proxy_pass http://qr_app;
    }
    location = /readyz {
        access_log off;
        proxy_pass http://qr_app;
    }

    # Prometheus metrics — never expose publicly. Restrict to the private
    # scrape network; adjust the CIDR to match the monitoring subnet.
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://qr_app;
    }

    # All other HTTP API traffic. limit_req protects mutation endpoints from
    # per-IP floods; burst absorbs legitimate spikes (page load fan-out).
    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://qr_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
