# SigNoz otel-collector config — SKELETON.
#
# ⚠️ Start from the official otel-collector config shipped with the PINNED
# SigNoz release (deploy/docker/otel-collector-config.yaml in the SigNoz repo):
# its exporter names, ClickHouse DSN wiring, and internal pipelines change
# between releases. Then re-apply the sections marked "QR-DINING" below — those
# are this project's decisions and must survive the merge.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # ── QR-DINING: app log collection (VM only) ──────────────────────────────
  # Tails the Docker json-file logs of the app container and parses the
  # zerolog NDJSON body. Zero app-code changes; requires the
  # /var/lib/docker/containers:ro mount in docker-compose.signoz.yml.
  # Container-name filtering: prefer the `container` operator if the pinned
  # collector version ships it; otherwise resolve the container id with
  #   docker inspect --format '{{.Id}}' qr_dining_app
  # and narrow `include` to that path (re-check after each app redeploy, or
  # keep the glob + filter processor on container.name below).
  filelog:
    include: ["/var/lib/docker/containers/*/*.log"]
    start_at: end
    operators:
      # Outer envelope: Docker json-file format {"log":"...","stream":"...","time":"..."}
      - type: json_parser
        parse_from: body
        timestamp:
          parse_from: attributes.time
          layout: "%Y-%m-%dT%H:%M:%S.%LZ"
      - type: move
        from: attributes.log
        to: body
      # Inner body: zerolog NDJSON from backend/internal/observability/logger.go.
      # Guests non-JSON lines (panics, stdlib output) pass through unparsed.
      - type: json_parser
        parse_from: body
        if: "body matches '^\\\\{'"
        severity:
          parse_from: attributes.level
      # QR-DINING: promote correlation fields for search + trace↔log pivot.
      - type: move
        from: attributes.trace_id
        to: trace_id
        if: "attributes.trace_id != nil"
      - type: move
        from: attributes.span_id
        to: span_id
        if: "attributes.span_id != nil"

processors:
  batch:
    send_batch_size: 10000
    timeout: 1s
  # QR-DINING: keep collector memory inside its 256m mem_limit.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 40
  # QR-DINING: drop log records from other projects' containers on the shared
  # VM (invoice, job-queue-system, sketchiple share /var/lib/docker/containers).
  # Exact processor/attribute depends on pinned version — the requirement is:
  # only qr_dining_app logs reach the logs pipeline.
  filter/qr-dining-only:
    logs:
      log_record:
        - 'resource.attributes["container.name"] != nil and resource.attributes["container.name"] != "qr_dining_app"'

exporters:
  # ⚠️ Placeholder names — copy the real ClickHouse exporter blocks (names,
  # DSNs, timeouts) from the pinned release's config verbatim.
  clickhousetraces:
    datasource: tcp://clickhouse:9000/signoz_traces
  clickhouselogsexporter:
    dsn: tcp://clickhouse:9000/signoz_logs
    timeout: 10s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhousetraces]
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, filter/qr-dining-only, batch]
      exporters: [clickhouselogsexporter]
    # QR-DINING: NO metrics pipeline in Phases 0–3. Prometheus + the 27 alert
    # rules in deploy/observability/ stay authoritative. Phase 4 may add a
    # prometheus receiver dual-scraping app:8080/metrics — decision deferred.
