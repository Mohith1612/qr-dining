# SigNoz self-hosted stack — SKELETON.
#
# ⚠️ Image tags below are placeholders from the 2025-era layout — verify latest
# at implementation time against the pinned SigNoz release's deploy/docker/
# compose file (https://github.com/SigNoz/signoz). The service layout itself
# (merged `signoz` container, schema migrators, keeper choice) also changes
# between releases: mirror the pinned release, keep the DECISIONS encoded here:
#   * host bindings: UI 127.0.0.1:3301, OTLP 127.0.0.1:4317/4318 — nothing else
#   * the signoz container's internal 8080 is NEVER published as host 8080
#   * ClickHouse/zookeeper: internal network only, no host ports
#   * every long-running service has an explicit mem_limit (shared VM)
#   * external network "signoz" is how the app container reaches the collector
#   * all images must be arm64 (Ampere VM; repo has no amd64 fallback)
#
# VM:         docker compose up -d          (project name qr-dining-signoz)
# Local eval: docker compose -p qr-dining-signoz-eval -f deploy/signoz/docker-compose.signoz.yml up -d
#
# ⚠️ Never run with -p qr-dining — that is the local soak stack (SEV-0 pending).

name: qr-dining-signoz

networks:
  signoz:
    external: true # docker network create signoz — shared with the app via overlay
  signoz_internal:
    internal: true

volumes:
  signoz_clickhouse_data:
  signoz_zookeeper_data:
  signoz_sqlite_data: # signoz container's own metadata (users, dashboards, retention)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  zookeeper:
    # verify latest at implementation time — use the exact image the pinned
    # SigNoz release references (newer releases may use clickhouse-keeper instead)
    image: bitnami/zookeeper:3.7.1
    restart: unless-stopped
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    volumes:
      - signoz_zookeeper_data:/bitnami/zookeeper
    networks: [signoz_internal]
    mem_limit: 256m
    logging: *default-logging

  clickhouse:
    # verify latest at implementation time — use the tag pinned by the SigNoz release
    image: clickhouse/clickhouse-server:24.1.2-alpine
    restart: unless-stopped
    depends_on: [zookeeper]
    # The pinned release ships cluster/user config XMLs (deploy/docker/clickhouse-setup/)
    # that must be mounted here — copy them next to this file at implementation time.
    # volumes:
    #   - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/config.xml:ro
    #   - ./clickhouse-cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    volumes:
      - signoz_clickhouse_data:/var/lib/clickhouse
    networks: [signoz_internal]
    mem_limit: 1536m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "127.0.0.1:8123/ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  schema-migrator-sync:
    # verify latest at implementation time — tag tracks the collector version
    image: signoz/signoz-schema-migrator:latest
    command: ["sync", "--dsn=tcp://clickhouse:9000", "--up="]
    depends_on:
      clickhouse:
        condition: service_healthy
    networks: [signoz_internal]
    restart: on-failure

  schema-migrator-async:
    image: signoz/signoz-schema-migrator:latest # verify latest at implementation time
    command: ["async", "--dsn=tcp://clickhouse:9000", "--up="]
    depends_on:
      schema-migrator-sync:
        condition: service_completed_successfully
    networks: [signoz_internal]
    restart: on-failure

  signoz:
    # verify latest at implementation time — merged query-service + web UI
    image: signoz/signoz:latest
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    # Copy the env block (ClickHouse DSN, storage paths, telemetry opt-out) from
    # the pinned release's compose file at implementation time.
    environment:
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: "tcp://clickhouse:9000"
      TELEMETRY_ENABLED: "false" # no phone-home from the self-hosted install
    volumes:
      - signoz_sqlite_data:/var/lib/signoz
    ports:
      # Container serves on 8080 internally — NEVER publish as host 8080 (app conflict).
      - "127.0.0.1:3301:8080"
    networks: [signoz_internal, signoz]
    mem_limit: 512m
    logging: *default-logging

  otel-collector:
    # verify latest at implementation time
    image: signoz/signoz-otel-collector:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    depends_on:
      schema-migrator-sync:
        condition: service_completed_successfully
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      # VM only: lets the filelog receiver tail the app container's json-file
      # logs. Harmless-but-useless on a dev machine (no qr_dining_app there).
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      # Localhost-only: used by a natively-run local backend. VM containers
      # reach the collector via the "signoz" network instead.
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    networks: [signoz_internal, signoz]
    mem_limit: 256m
    logging: *default-logging
