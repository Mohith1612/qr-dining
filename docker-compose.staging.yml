# Staging / local burn-in override.
#
# Usage:
#   docker network create proxy_network   # once, if it does not exist
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Purpose: make the prod topology reproducible locally for chaos + burn-in.
# - Publishes the app on :8080 so chaos drivers and Playwright can reach it
#   directly (bypassing the edge) for fault-injection assertions.
# - Adds the nginx edge (using deploy/nginx/qr-dining.conf) on :8080->:80 of the
#   host via :18080 so the websocket-through-proxy and nginx-reload chaos
#   experiments are exercisable. Direct app access stays on :8080.

services:
  postgres:
    # Published locally so the chaos bootstrap can seed via the host. Do NOT
    # publish Postgres in real staging/prod — it stays on the internal network.
    ports:
      - "5432:5432"

  redis:
    # Published locally for host-run app + chaos drivers only. Not for prod.
    ports:
      - "6379:6379"

  app:
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/qr-dining.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "18080:80"
    networks:
      - proxy
