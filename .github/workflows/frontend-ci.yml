name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "marketing/**"
      - "e2e/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "marketing/**"
      - "e2e/**"
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          ALLOW_LOCALHOST_BUILD: "true"

  marketing:
    name: Marketing Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: marketing/package-lock.json

      - run: npm ci
      - run: npm run build

  e2e-typecheck:
    name: E2E Test Discovery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci
      - name: Validate Playwright config and discover tests
        run: npx --no-install playwright test --list
