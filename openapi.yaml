        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Platform: cross-tenant analytics (Postgres aggregation) ─────────────────
  /platform/analytics/usage:
    get:
      summary: Cross-tenant usage analytics
      description: |
        Sessions/orders/payments/participant-joins per period, active branches, active diners.
        NOT entitlement-gated (operator surface). Optional `organization_id` filter.
      tags: [Platform Analytics]
      security:
        - PlatformBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdQuery"
        - $ref: "#/components/parameters/PeriodQuery"
      responses:
        "200":
          description: Usage report
          content:
            application/json:
              schema:
                type: object
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /platform/analytics/revenue:
    get:
      summary: Cross-tenant revenue analytics (GMV from completed payments)
      tags: [Platform Analytics]
      security:
        - PlatformBearer: []
      parameters:
        - $ref: "#/components/parameters/OrganizationIdQuery"
        - $ref: "#/components/parameters/PeriodQuery"
      responses:
        "200":
          description: Revenue report
          content:
            application/json:
              schema:
                type: object
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /platform/analytics/health:
    get:
