openapi: "3.1.0"
info:
  title: qr-dining API
  version: "2.0.0"
  description: |
    Realtime, session-centric dine-in operating system plus its SaaS control plane.
    Covers the guest dining loop (session lifecycle, shared cart, orders, payments, assistance,
    snapshot reconnect), the staff operational surface (kitchen/waiter/admin), and the platform
    governance layer (organizations, branches, plans, entitlements, feature flags, analytics,
    themes, support console, billing, subscriptions, premium QR collateral).

    ## Trust domains & auth
    Every authenticated request uses `Authorization: Bearer <token>`. There are **three distinct,
    non-interchangeable token types**, one per trust domain:

    - **Public** — no auth (`/health`, menu read, QR resolve, tenant resolve, plans, webhooks).
    - **Guest** (`GuestBearer`) — a stateless HMAC session token issued by `POST /sessions` /
      `POST /sessions/{id}/join`. Enforcement is gated by the `AUTH_GUEST_CREDENTIALS_REQUIRED`
      (R6) rollout flag; independent of that flag, a *present-but-invalid* token is always rejected
      (401/403), never failed-open. `X-Participant-ID` is still sent on some guest mutations as a
      **participant identifier, not a credential**.
    - **Staff** (`StaffBearer`) — opaque token from `POST /staff/auth` (also accepted as an HttpOnly
      cookie when `AUTH_STAFF_COOKIE_ENABLED`). Roles: `owner`, `manager`, `waiter`, `kitchen`.
    - **Platform** (`PlatformBearer`) — a separate super-admin trust domain from `POST /platform/auth`
      (+ `POST /platform/auth/mfa` when TOTP MFA is enrolled). **Staff/guest tokens are rejected on
      `/platform/*`.** Platform RBAC: `super_admin` (bypass) > `support_admin` > `billing_admin` >
      `read_only_auditor`.

    ## Conventions
    - **Error shape.** All non-2xx responses use `APIError`: `{"code":"...", "message":"..."}`.
      Clients MUST key on the stable `code`; `message` is human-readable and may change.
    - **Money** is serialized as a decimal **string** (e.g. `"12.50"`), never a float.
    - **Shadow/inert surfaces.** Entitlements & feature flags are *resolve-only* (computed, not yet
      enforced); org/branch suspend/activate flips a status column no operational path reads yet.
      Such endpoints are annotated in their descriptions.
    - No global `/api/v1` prefix — paths are root-relative.

servers:
  - url: http://localhost:8080
    description: Local development

# Public-by-default: most guest/menu/webhook/tenant endpoints require no auth. Authenticated
# operations (guest/staff/platform) override this with their own `security` block. An empty
# array means "no authentication required".
security: []

components:
  securitySchemes:
    GuestBearer:
      type: http
      scheme: bearer
      description: |
        Guest session HMAC token (`guest_access_token`) returned by `POST /sessions` and
        `POST /sessions/{id}/join`. Carries session/branch/table/participant/role + credential
        version + expiry (default TTL 2h). Enforcement is gated by `AUTH_GUEST_CREDENTIALS_REQUIRED`
        (R6); a present-but-invalid token is always rejected regardless of the flag.
    StaffBearer:
      type: http
      scheme: bearer
      description: Staff token returned by `POST /staff/auth` (or HttpOnly cookie when `AUTH_STAFF_COOKIE_ENABLED`).
    PlatformBearer:
      type: http
      scheme: bearer
      description: |
        Platform operator token returned by `POST /platform/auth` (+ `POST /platform/auth/mfa` when
        MFA is enrolled). Separate trust domain — staff/guest tokens are rejected on `/platform/*`.
        Per-operation RBAC roles are noted in each endpoint description.
    ParticipantID:
      type: apiKey
      in: header
      name: X-Participant-ID
      description: |
        Participant identifier (int64) returned when creating or joining a session. This is an
        **identifier, not an auth credential** — the guest `Authorization: Bearer` token is the
        credential. Sent on guest mutations to attribute the acting participant.

  parameters:
    BranchIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Branch id
    OrgIdPath:
      name: org_id
      in: path
      required: true
      schema:
        type: integer
      description: Organization id
    BranchIdParam:
      name: branch_id
      in: path
      required: true
      schema:
        type: integer
      description: Branch id (platform path segment `:branch_id`)
    IntIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
    FlagKeyPath:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: Feature-flag key
    InvoiceIdPath:
      name: invoice_id
      in: path
      required: true
      schema:
        type: integer
      description: Invoice id
    PeriodQuery:
      name: period
      in: query
      required: false
      schema:
        type: string
        enum: [daily, weekly, monthly]
        default: weekly
      description: Aggregation period
    OrganizationIdQuery:
      name: organization_id
      in: query
      required: false
      schema:
        type: integer
      description: Optional org filter for cross-tenant analytics

  schemas:
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code (never changes)
          example: SESSION_NOT_FOUND
        message:
          type: string
          description: Human-readable error detail (may change)
          example: session not found

    Session:
      type: object
      description: |
        A table dining session. **The guest credential `session_token` is intentionally never
        returned** — it is stripped from every guest-facing response by `guestSafeSession()`
        (remediation F-8), independent of the R6 flag.
      properties:
        id:
          type: string
          format: uuid
        session_number:
          type: string
          description: Human-readable operational reference
        branch_id:
          type: integer
        table_id:
          type: integer
        host_participant_id:
          type: [integer, "null"]
        status:
          type: string
          description: 6-state lifecycle (migration 000023)
          enum: [active, payment_pending, awaiting_reactivation, abandoned, expired, closed]
        created_at:
          type: string
          format: date-time
        closed_at:
          type: [string, "null"]
          format: date-time
        awaiting_reactivation_at:
          type: [string, "null"]
          format: date-time

    Participant:
      type: object
      properties:
        id:
          type: integer
        session_id:
          type: string
          format: uuid
        display_name:
          type: string
        is_host:
          type: boolean
        joined_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        device_fingerprint:
          type: [string, "null"]

    ModifierSnapshot:
      type: object
      description: Price-snapshotted modifier applied to a cart item or order item
      properties:
        id:
          type: integer
        name:
          type: string
        price_delta:
          type: number
          description: Price adjustment (positive = surcharge, negative = discount)

    CartItem:
      type: object
      properties:
        id:
          type: integer
        session_id:
          type: string
          format: uuid
        participant_id:
          type: integer
        menu_item_id:
          type: integer
        quantity:
          type: integer
        selected_modifiers:
          type: array
          description: Modifier snapshots captured at add-to-cart time
          items:
            $ref: "#/components/schemas/ModifierSnapshot"
        note:
          type: string
        added_at:
          type: string
          format: date-time

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: integer
        branch_id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: string
          description: Decimal string e.g. "12.50"
        is_available:
          type: boolean
        position:
          type: integer
          description: Display order within the category
        is_featured:
          type: boolean
        featured_sort_order:
          type: integer
        dietary_flags:
          type: array
          items:
            type: string
            enum: [vegetarian, vegan, jain, egg, non-veg]
        item_badges:
          type: array
          items:
            type: string
            enum: [chef-special, bestseller, seasonal, new]
        spice_level:
          type: integer
          minimum: 0
          maximum: 3

    MenuCategory:
      type: object
      properties:
        id:
          type: integer
        branch_id:
          type: integer
        name:
          type: string
        position:
          type: integer
          description: Display order of this category
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        branch_id:
          type: integer
        placed_by_participant_id:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, served, cancelled]
        total_amount:
          type: string
          description: Decimal string
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: string
          format: uuid
        menu_item_id:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: string
        selected_modifiers:
          type: array
          description: Modifier snapshots captured at order placement time
          items:
            $ref: "#/components/schemas/ModifierSnapshot"
        note:
          type: string

    AssistanceRequest:
      type: object
      properties:
        id:
          type: integer
        session_id:
          type: string
          format: uuid
        table_id:
          type: integer
        participant_id:
          type: integer
        type:
          type: string
          enum: [waiter, bill, other]
        status:
          type: string
          enum: [pending, acknowledged, resolved]
        created_at:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: integer
        session_id:
          type: string
          format: uuid
        order_id:
          type: [string, "null"]
          format: uuid
        amount:
          type: string
        method:
          type: string
          enum: [cash, card, digital, card_manual, upi]
        status:
          type: string
          enum: [pending, requested, provider_pending, requires_staff_confirmation, completed, failed, cancelled, refunded, partially_refunded]
        initiated_at:
          type: string
          format: date-time
        bill_snapshot_id:
          type: [integer, "null"]
        branch_id:
          type: integer
        currency:
          type: string
        provider_payment_ref:
          type: [string, "null"]

    Staff:
      type: object
      properties:
        id:
          type: integer
        branch_id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [owner, manager, kitchen, waiter]

    StaffSession:
      type: object
      properties:
        staff_id:
          type: integer
        branch_id:
          type: integer
        role:
          type: string
        token:
          type: string

    SessionSnapshot:
      type: object
      description: |
        Full authoritative session state for WebSocket reconnect reconciliation. The embedded
        `session` is guest-safe (no `session_token`, F-8). Reconcile semantics:
        - if `snapshot_authoritative: true`, replace local state wholesale (no incremental basis,
          or the requested gap could not be replayed contiguously);
        - otherwise replay `missed_events` (contiguous from `last_sequence`) then reconcile.
        The shared cart is NOT included here — refetch it via `GET /sessions/{id}/cart`.
      properties:
        session:
          $ref: "#/components/schemas/Session"
        table_identifier:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        assistance:
          type: array
          items:
            $ref: "#/components/schemas/AssistanceRequest"
        missed_events:
          type: array
          description: Contiguous events since `last_sequence`; omitted when authoritative
          items:
            type: object
            additionalProperties: true
        snapshot_authoritative:
          type: boolean
          description: When true, this snapshot is the whole truth — replace local state
        session_ended:
          type: boolean
        close_reason:
          type: string
        snapshot_at:
          type: string
          format: date-time

    EventLogEntry:
      type: object
      properties:
        id:
          type: integer
        session_id:
          type: string
          format: uuid
        branch_id:
          type: integer
        event_type:
          type: string
        actor_type:
          type: string
        actor_id:
          type: integer
        payload:
          type: object
        created_at:
          type: string
          format: date-time

    Bill:
      type: object
      description: Itemized bill for a session. Money fields are numbers (₹); currency defaults to INR.
      properties:
        session_id:
          type: string
          format: uuid
        orders:
          type: array
          items:
            type: object
            properties:
              order_id: { type: string, format: uuid }
              order_number: { type: string }
              placed_at: { type: string, format: date-time }
              order_total: { type: number }
              items:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    quantity: { type: integer }
                    unit_price: { type: number }
                    modifiers: { type: array, items: { type: string } }
                    line_total: { type: number }
        subtotal: { type: number }
        tax_rate: { type: number }
        tax_amount: { type: number }
        service_charge_rate: { type: number }
        service_charge: { type: number }
        discount_amount: { type: number }
        tip_amount: { type: number }
        total: { type: number }
        currency:
          type: string
          example: INR

    ThemeConfig:
      type: object
      description: Resolved theme — a preset key plus allowlisted hex design tokens.
      properties:
        preset:
          type: string
          enum: [dark-luxury, modern-minimal, warm-cafe, vibrant]
        tokens:
          type: object
          description: Map of allowlisted token key → hex colour (#RRGGBB or #RRGGBBAA)
          additionalProperties:
            type: string

    CollateralConfig:
      type: object
      description: |
        Branch-scoped premium QR print collateral config. Strictly validated — unknown JSON keys
        are rejected (400). Consumes the theme for colour/typography; owns only the physical concern.
      additionalProperties: false
      properties:
        format:
          type: string
          enum: [standing_card, table_tent, sticker, square_card, bulk_sheet]
        showLogo: { type: boolean }
        showBranch: { type: boolean }
        showWifi: { type: boolean }
        showFooter: { type: boolean }
        welcomeMessage: { type: string, maxLength: 120 }
        subtitle: { type: string, maxLength: 160 }
        footerNote: { type: string, maxLength: 160 }
        branchDisplay: { type: string, maxLength: 60 }
        tagline: { type: string, maxLength: 120 }
        wifiName: { type: string, maxLength: 64 }
        wifiPassword: { type: string, maxLength: 64 }
        instagram: { type: string, maxLength: 120 }
        website: { type: string, maxLength: 200 }

    FlagOverrideRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        reason:
          type: string

    FlagState:
      type: object
      description: Resolved feature-flag state (precedence branch > org > global > catalog default)
      properties:
        key:
          type: string
        enabled:
          type: boolean
        source:
          type: string
          enum: [branch_override, org_override, global_override, default]

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            code: SESSION_NOT_FOUND
            message: session not found
    Unauthorized:
      description: Missing or invalid auth token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            code: UNAUTHORIZED
            message: invalid or expired token
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            code: FORBIDDEN
            message: access denied
    ValidationError:
      description: Malformed request body or query param
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            code: VALIDATION_ERROR
            message: "display_name: required"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            code: INTERNAL_ERROR
            message: internal server error
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            code: RATE_LIMITED
            message: rate limit exceeded
    Conflict:
      description: State conflict (e.g. invalid lifecycle transition, duplicate key)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            code: INVALID_TRANSITION
            message: invalid state transition
    ServiceUnavailable:
      description: A required dependency is unconfigured or unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            code: MFA_NOT_CONFIGURED
            message: MFA is not configured on this server
    AnalyticsResult:
      description: Analytics result (shape varies by endpoint; includes the requested period)
      content:
        application/json:
          schema:
            type: object
            properties:
              period:
                type: string
                enum: [daily, weekly, monthly]
            additionalProperties: true
    AnalyticsForbidden:
      description: Access denied, or analytics not available on the current plan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            code: ANALYTICS_GATED
            message: analytics is not available on your current plan
    SubscriptionResult:
      description: The organization subscription after the operation
      content:
        application/json:
          schema:
            type: object
            properties:
              subscription:
                type: object
    InvoiceResult:
      description: The invoice after the lifecycle transition
      content:
        application/json:
          schema:
            type: object
            properties:
              invoice:
                type: object

paths:
  # ── Infrastructure ────────────────────────────────────────────────────────
  /health:
    get:
      summary: Liveness probe
      tags: [Infrastructure]
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      summary: Readiness probe — checks PostgreSQL and Redis connectivity
      tags: [Infrastructure]
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: One or more dependencies unhealthy

  /metrics:
    get:
      summary: Prometheus metrics endpoint
      tags: [Infrastructure]
      responses:
        "200":
          description: Prometheus text format metrics

  # ── Sessions ──────────────────────────────────────────────────────────────
  /sessions:
    post:
      summary: Create a new dining session
      description: |
        Creates a session for a table and inserts the caller as the **host** participant.
        Returns the guest credential (`guest_access_token`) used as the `GuestBearer` token on all
        subsequent session calls. No auth required to call this endpoint.
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table_id, display_name]
              properties:
                table_id:
                  type: integer
                  example: 1
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: Alice
                device_fingerprint:
                  type: string
                phone_e164:
                  type: string
                  description: Optional E.164 phone; invalid values → 400 INVALID_PHONE
            example:
              table_id: 1
              display_name: Alice
      responses:
        "201":
          description: Session created (caller is host)
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
                  participant:
                    $ref: "#/components/schemas/Participant"
                  guest_access_token:
                    type: string
                    description: "Guest credential — use as the Authorization Bearer token on session calls"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Table not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "409":
          description: Table already has an active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: SESSION_ALREADY_ACTIVE
                message: session already active for this table
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /sessions/{id}:
    get:
      summary: Get session by ID
      description: Guest-safe — the `session_token` credential is never returned (F-8).
      tags: [Sessions]
      security:
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      summary: Close a session (host only)
      description: |
        Closes the session; host only. The acting participant is identified by the
        `X-Participant-ID` header (legacy) or the `GuestBearer` token. Frees the table and
        revokes guest credentials.
      tags: [Sessions]
      security:
        - GuestBearer: []
          ParticipantID: []
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session closed
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          description: Requester is not the session host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: NOT_SESSION_HOST
                message: only the session host can close the session
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session already closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: SESSION_CLOSED
                message: session is already closed

  /sessions/{id}/join:
    post:
      summary: Join an existing session as a new participant
      tags: [Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 50
                device_fingerprint:
                  type: string
                phone_e164:
                  type: string
                  description: Optional E.164 phone; invalid values → 400 INVALID_PHONE
            example:
              display_name: Bob
      responses:
        "201":
          description: Joined session — returns the new participant's guest credential
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
                  participant:
                    $ref: "#/components/schemas/Participant"
                  guest_access_token:
                    type: string
                    description: Guest credential for this participant
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: SESSION_CLOSED
                message: session is already closed

  /sessions/{id}/reactivate:
    post:
      summary: Reactivate an awaiting_reactivation session
      description: |
        Transitions a session in `awaiting_reactivation` back to `active` so a returning guest can
        resume ordering without a full refresh. Requires a credentialed member of the session.
      tags: [Sessions]
      security:
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session reactivated (guest-safe)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /sessions/{id}/ws-ticket:
    post:
      summary: Issue an ephemeral WebSocket ticket
      description: |
        Exchanges the guest credential for a short-lived (~30s) single-use ticket consumed by
        `GET /ws?ticket=…`. Requires a valid `GuestBearer` token belonging to this **active**
        session. Rate limited: sensitive 60/min per IP + 12/min per session.
      tags: [Sessions, WebSocket]
      security:
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                  expires_in:
                    type: integer
                    example: 30
        "401":
          description: Missing/invalid/revoked guest credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "403":
          description: Credential does not belong to this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "409":
          description: Session is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /sessions/{id}/snapshot:
    get:
      summary: Full session state snapshot for WebSocket reconnect reconciliation
      description: |
        Returns the full authoritative current state of the session. Call this on WebSocket
        reconnect and either replay `missed_events` or replace local state when
        `snapshot_authoritative` is true. The shared cart is fetched separately. Terminal sessions
        remain readable for 60 minutes after close; afterward this returns 410.
      tags: [Sessions, WebSocket]
      security:
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: last_sequence
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Highest event sequence the client already has; drives missed-event replay
      responses:
        "200":
          description: Full session snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Terminal-session read window (60 min) has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: SESSION_ENDED
                message: session read window expired
        "429":
          $ref: "#/components/responses/RateLimited"

  # ── Cart ──────────────────────────────────────────────────────────────────
  /sessions/{id}/cart:
    get:
      summary: Get the shared session cart
      description: One shared cart per session — all participants see the same items (`participant_id` is null on shared-cart rows).
      tags: [Cart]
      security:
        - GuestBearer: []
          ParticipantID: []
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cart contents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CartItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /sessions/{id}/cart/items:
    post:
      summary: Add item to cart
      tags: [Cart]
      security:
        - GuestBearer: []
          ParticipantID: []
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [menu_item_id, quantity]
              properties:
                menu_item_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 99
                modifier_ids:
                  type: array
                  items:
                    type: integer
                note:
                  type: string
      responses:
        "201":
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Menu item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: MENU_ITEM_NOT_FOUND
                message: menu item not found
        "422":
          description: Menu item unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: MENU_ITEM_UNAVAILABLE
                message: menu item is not available

  /sessions/{id}/cart/items/{item_id}:
    delete:
      summary: Remove item from cart
      tags: [Cart]
      security:
        - GuestBearer: []
          ParticipantID: []
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Item removed
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: CART_ITEM_NOT_FOUND
                message: cart item not found

  # ── Orders ────────────────────────────────────────────────────────────────
  /sessions/{id}/orders:
    post:
      summary: Place an order (idempotent)
      description: |
        Places a new order for the session. **Host-gated** server-side — only the session host may
        submit (an absent host is reassigned on-demand). Idempotent: a repeated `idempotency_key`
        returns the original order with HTTP 201. Rate limited to 12/min per session.
      tags: [Orders]
      security:
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, placed_by_participant_id, idempotency_key, items]
              properties:
                branch_id:
                  type: integer
                placed_by_participant_id:
                  type: integer
                idempotency_key:
                  type: string
                  description: Client-generated unique key; repeat submissions return the original order
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [menu_item_id, quantity]
                    properties:
                      menu_item_id:
                        type: integer
                      quantity:
                        type: integer
                      modifier_ids:
                        type: array
                        items:
                          type: integer
                      note:
                        type: string
      responses:
        "201":
          description: Order placed (or idempotent replay)
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
                  order_items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not the session host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: NOT_SESSION_HOST
                message: only the session host can place orders
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: Menu item unavailable or zero-quantity item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
    get:
      summary: List all orders for a session
      tags: [Orders]
      security:
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /orders/{id}/status:
    patch:
      summary: Update order status (staff only)
      tags: [Orders]
      security:
        - StaffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [confirmed, preparing, ready, served, cancelled]
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: INVALID_ORDER_TRANSITION
                message: cannot transition from served to pending

  # ── Assistance ────────────────────────────────────────────────────────────
  /sessions/{id}/assist:
    post:
      summary: Request waiter assistance
      description: Rate limited to 6/min per session.
      tags: [Assistance]
      security:
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table_id]
              properties:
                table_id:
                  type: integer
                participant_id:
                  type: integer
                type:
                  type: string
                  enum: [waiter, bill, other]
                  default: waiter
      responses:
        "201":
          description: Assistance requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistanceRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: SESSION_NOT_FOUND
                message: session not found

  /assist/{id}/ack:
    patch:
      summary: Acknowledge an assistance request (staff only)
      tags: [Assistance]
      security:
        - StaffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistanceRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: INVALID_ASSISTANCE_TRANSITION
                message: cannot acknowledge an already-resolved request

  /assist/{id}/resolve:
    patch:
      summary: Resolve an assistance request (staff only)
      tags: [Assistance]
      security:
        - StaffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistanceRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  # ── Payments ──────────────────────────────────────────────────────────────
  /sessions/{id}/payments:
    post:
      summary: Initiate a payment
      description: |
        **Host-gated** — only the session host may initiate. Freezes the cart (`payment_pending`)
        and captures an immutable bill snapshot. Provider methods go `provider_pending` (resolved by
        webhook); cash/manual go `requires_staff_confirmation` (resolved by staff settle). No fake
        success — the guest waits for a real `PAYMENT_COMPLETED`. Rate limited: sensitive 30/min per
        IP + 6/min per session.
      tags: [Payments]
      security:
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method, idempotency_key]
              properties:
                order_id:
                  type: [string, "null"]
                  format: uuid
                  description: Omit for session-level payments
                amount:
                  type: number
                  minimum: 0.01
                method:
                  type: string
                  enum: [cash, card, digital, card_manual, upi]
                idempotency_key:
                  type: string
                  description: Client-generated payment idempotency key scoped to the session and guest actor
                provider_payment_ref:
                  type: string
                  description: Provider payment reference for externally created provider payments
      responses:
        "201":
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not the session host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: NOT_SESSION_HOST
                message: only the session host can initiate payment
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: SESSION_NOT_FOUND
                message: session not found
        "409":
          description: Cart already frozen / payment in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /webhooks/payments/{provider}:
    post:
      summary: Receive signed generic payment provider webhook (idempotent)
      tags: [Payments]
      parameters:
        - name: X-Payment-Timestamp
          in: header
          required: true
          schema:
            type: string
          description: Unix timestamp used in the HMAC payload
        - name: X-Payment-Signature
          in: header
          required: true
          schema:
            type: string
          description: Hex HMAC SHA-256 of `timestamp.raw_body`
        - name: provider
          in: path
          required: true
          schema:
            type: string
            example: stripe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: Provider-side event ID (idempotency key)
                event:
                  type: string
                  description: Event type e.g. payment.captured
      responses:
        "200":
          description: Webhook received (including idempotent replay)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /payments/{id}/settle:
    patch:
      summary: Staff-settle a manual payment
      tags: [Payments]
      security:
        - StaffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment settled by authorized staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Payment is not awaiting staff confirmation or the bill snapshot is stale

  /sessions/{id}/bill:
    get:
      summary: Get the itemized bill for a session
      tags: [Payments]
      security:
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Itemized bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{id}/customer:
    post:
      summary: Link a customer (guest opt-in)
      description: Optional post-payment opt-in linking a phone to the session for loyalty/CRM. Returns 404 FEATURE_DISABLED if the feature is off for the tenant.
      tags: [Customers]
      security:
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: E.164 phone number
                display_name:
                  type: string
      responses:
        "200":
          description: Customer linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: INVALID_PHONE
                message: invalid phone number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Session not found or customer opt-in feature disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /sessions/{id}/promos/validate:
    post:
      summary: Validate a promo code (preview)
      description: Previews whether a promo code is currently valid for the session's branch. Min-order check is skipped in preview.
      tags: [Promos]
      security:
        - GuestBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Promo is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  promo_id: { type: integer }
                  discount_amount: { type: number }
                  description: { type: string }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Promo or session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: PROMO_NOT_FOUND
                message: This promo code isn't valid right now.
        "409":
          description: Promo exhausted or already used by this guest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: Minimum order amount not met
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  # ── Menu ──────────────────────────────────────────────────────────────────
  /branches/{id}/menu:
    get:
      summary: Get full menu for a branch
      tags: [Menu]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full menu with categories and items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuCategory"
        "500":
          $ref: "#/components/responses/InternalError"

  /branches/{id}/feature-flags:
    get:
      summary: Resolve product feature flags for a branch (public, cached)
      description: |
        Returns the resolved boolean state of product feature flags for the branch
        (precedence branch > org > global > catalog default). Redis-cached. Separate from the
        nine env strict-rollout flags. Tenant-guarded when `TENANCY_ORGANIZATIONS_ENABLED`.
      tags: [Feature Flags]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Resolved flags as a map of key to enabled boolean"
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature_flags:
                    type: object
                    additionalProperties:
                      type: boolean
        "404":
          $ref: "#/components/responses/NotFound"

  /branches/{id}/theme:
    get:
      summary: Resolve the theme for a branch (public)
      description: |
        Returns the structured theme (preset + tokens) used to brand the guest UI. Falls back
        through structured `tenant_themes` → legacy `settings.theme` → `dark-luxury`.
        Tenant-guarded when `TENANCY_ORGANIZATIONS_ENABLED`.
      tags: [Themes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved theme
          content:
            application/json:
              schema:
                type: object
                properties:
                  theme:
                    $ref: "#/components/schemas/ThemeConfig"
        "404":
          $ref: "#/components/responses/NotFound"

  /tables/by-qr/{token}:
    get:
      summary: Resolve a QR code token to table metadata
      tags: [Menu]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Table found
        "404":
          description: Token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: SESSION_NOT_FOUND
                message: table not found

  # ── Tenancy & Plans (public) ──────────────────────────────────────────────
  /tenants/by-slug/{slug}:
    get:
      summary: Resolve a restaurant by URL slug (bootstraps frontend tenant context)
      tags: [Tenancy]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant context (includes additive structured theme)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  organization_id: { type: integer }
                  name: { type: string }
                  slug: { type: string }
                  settings:
                    type: object
                    description: Legacy settings_json (unchanged, back-compat)
                  theme:
                    $ref: "#/components/schemas/ThemeConfig"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: TENANT_NOT_FOUND
                message: restaurant not found

  /plans:
    get:
      summary: List subscription plans (public)
      tags: [Subscriptions]
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      type: object

  # ── Menu Management (staff) ───────────────────────────────────────────────
  /branches/{id}/menu/categories:
    post:
      summary: Create a menu category (owner/manager only)
      tags: [Menu Management]
      security:
        - StaffBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                position:
                  type: integer
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /branches/{id}/menu/items:
    post:
      summary: Create a menu item (owner/manager only)
      tags: [Menu Management]
      security:
