  # ── Staff Auth ────────────────────────────────────────────────────────────
  /staff/auth:
    post:
      summary: Authenticate staff (10 RPM limit, fail-closed)
      description: |
        Authenticate with PIN plus either a numeric `branch_id` or a `branch_code`+`staff_code`.
        When `AUTH_STAFF_CODE_REQUIRED` (R4) is on, `branch_code`+`staff_code` are required.
        Repeated failures trigger a lockout (423).
      tags: [Staff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                branch_id:
                  type: integer
                  description: Numeric branch id (legacy identifier path)
                branch_code:
                  type: string
                  description: Branch code (required with staff_code under R4)
                staff_code:
                  type: string
                  description: Per-staff code (required under R4)
                pin:
                  type: string
                  minLength: 4
                  maxLength: 8
                device_name:
                  type: string
            example:
              branch_id: 1
              pin: "1234"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSession"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: UNAUTHORIZED
                message: invalid credentials
        "423":
          description: Locked out after too many failed attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
              example:
                code: AUTH_LOCKED_OUT
                message: too many failed attempts; try again later
        "429":
          $ref: "#/components/responses/RateLimited"

