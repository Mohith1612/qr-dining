  # ══ PLATFORM ════════════════════════════════════════════════════════════════
  # Separate trust domain. Auth endpoints are public; everything else needs a
  # PlatformBearer token. Per-operation platform RBAC roles are noted in descriptions
  # (super_admin always bypasses).

  # ── Platform: authentication & MFA ──────────────────────────────────────────
  /platform/auth:
    post:
      summary: Authenticate a platform operator
      description: |
        Email + password. Returns a full session, or an MFA challenge (`mfa_required: true`) when the
        operator has TOTP enrolled — complete it via `POST /platform/auth/mfa`. 10 RPM, fail-closed;
        repeated failures lock out (423).
      tags: [Platform Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                device_name: { type: string }
      responses:
        "200":
          description: Session issued, or an MFA challenge
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Full session
                  - type: object
                    properties:
                      mfa_required: { type: boolean }
                      mfa_challenge: { type: string }
                      mfa_expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "423":
          description: Locked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429": { $ref: "#/components/responses/RateLimited" }

  /platform/auth/mfa:
    post:
      summary: Complete an MFA login challenge
      tags: [Platform Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_challenge, mfa_code]
              properties:
                mfa_challenge: { type: string }
                mfa_code: { type: string, description: TOTP or recovery code }
                device_name: { type: string }
      responses:
        "200":
          description: Full platform session
          content:
            application/json:
              schema:
                type: object
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Invalid challenge or code (MFA_INVALID_CODE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "429": { $ref: "#/components/responses/RateLimited" }

  /platform/auth/logout:
    post:
      summary: Invalidate the current platform token
      tags: [Platform Auth]
      security:
        - PlatformBearer: []
      responses:
        "204":
          description: Logged out
        "401": { $ref: "#/components/responses/Unauthorized" }

  /platform/mfa/enroll:
    post:
      summary: Begin TOTP MFA enrollment
      description: Returns the secret + otpauth URI (shown once). 503 MFA_NOT_CONFIGURED if the server has no MFA encryption key.
      tags: [Platform Auth]
      security:
        - PlatformBearer: []
      responses:
        "200":
          description: Enrollment setup
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /platform/mfa/confirm:
    post:
      summary: Confirm TOTP enrollment with the first code
      description: Returns recovery codes (shown once). 503 MFA_NOT_CONFIGURED when MFA is unavailable.
      tags: [Platform Auth]
      security:
        - PlatformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Enrolled — recovery codes returned
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Invalid code (MFA_INVALID_CODE) or unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /platform/mfa/disable:
    post:
      summary: Disable MFA (requires a current TOTP or recovery code)
      tags: [Platform Auth]
      security:
        - PlatformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "204":
          description: MFA disabled
        "401":
          description: Invalid code or unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

