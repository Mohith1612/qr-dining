  /platform/organizations/{org_id}/payments:
    get:
      summary: List recorded manual payments (billing bookkeeping)
      tags: [Billing]
      security:
        - PlatformBearer: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      type: object
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Record a manual payment (billing_admin)
      tags: [Billing]
      security:
        - PlatformBearer: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount]
              properties:
                method:
                  type: string
                  enum: [upi, bank_transfer, cash, cheque, other]
                amount: { type: string, description: Numeric string }
                currency: { type: string }
                reference_number: { type: string }
                notes: { type: string }
                received_at: { type: [string, "null"], format: date-time }
                invoice_id: { type: [integer, "null"] }
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment:
                    type: object
        "400":
          description: Invalid amount or method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Organization or referenced invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /platform/organizations/{org_id}/invoices:
    get:
      summary: List the org's invoices
      tags: [Billing]
      security:
        - PlatformBearer: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items:
                      type: object
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create a draft invoice (billing_admin)
      tags: [Billing]
      security:
        - PlatformBearer: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: string, description: Numeric string }
                currency: { type: string }
                due_date: { type: [string, "null"], format: date-time }
                notes: { type: string }
      responses:
        "201":
          description: Draft invoice created
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice:
                    type: object
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /platform/organizations/{org_id}/invoices/{invoice_id}:
    get:
      summary: Get an invoice
      tags: [Billing]
      security:
        - PlatformBearer: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/InvoiceIdPath"
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice:
                    type: object
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Invoice not found (INVOICE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /platform/organizations/{org_id}/invoices/{invoice_id}/issue:
    post:
      summary: Issue a draft invoice (billing_admin)
      tags: [Billing]
      security:
        - PlatformBearer: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/InvoiceIdPath"
      responses:
        "200": { $ref: "#/components/responses/InvoiceResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "409":
          description: Invalid invoice status transition (INVALID_TRANSITION)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /platform/organizations/{org_id}/invoices/{invoice_id}/mark-paid:
    post:
      summary: Mark an issued invoice paid (billing_admin)
      tags: [Billing]
      security:
        - PlatformBearer: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/InvoiceIdPath"
      responses:
        "200": { $ref: "#/components/responses/InvoiceResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "409":
          description: Invalid invoice status transition (INVALID_TRANSITION)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /platform/organizations/{org_id}/invoices/{invoice_id}/cancel:
    post:
      summary: Cancel a draft/issued invoice (billing_admin)
      tags: [Billing]
      security:
        - PlatformBearer: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
        - $ref: "#/components/parameters/InvoiceIdPath"
      responses:
        "200": { $ref: "#/components/responses/InvoiceResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "409":
          description: Invalid invoice status transition (INVALID_TRANSITION)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  # ── Platform: enforcement observability (read-only) ─────────────────────────
  /platform/observability/subscriptions:
    get:
      summary: Subscriptions that enforcement would affect (read-only)
      tags: [Enforcement Observability]
      security:
        - PlatformBearer: []
      responses:
        "200":
          description: Observability report
          content:
            application/json:
              schema:
                type: object
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /platform/observability/entitlements:
