  # ── Platform: plans & entitlements (resolve-only/shadow) ────────────────────
  /platform/entitlements:
    get:
      summary: List the entitlement catalog (capabilities + limits)
      description: |
        Roles support_admin | billing_admin | read_only_auditor. Capability keys include
        analytics.basic, analytics.advanced, custom.theme, multi_branch, advanced.audit,
        support.priority, api.access; limit keys limit.branches/staff/tables (-1 = unlimited).
      tags: [Plans & Entitlements]
      security:
        - PlatformBearer: []
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlements:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        kind: { type: string, enum: [capability, limit] }
                        description: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /platform/plans:
    get:
      summary: List plans with their entitlement defaults
      tags: [Plans & Entitlements]
      security:
        - PlatformBearer: []
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      type: object
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create a plan (super_admin)
      tags: [Plans & Entitlements]
      security:
        - PlatformBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tier]
              properties:
                name: { type: string }
                tier:
                  type: string
                  enum: [free, standard, premium]
                price_monthly:
                  type: string
                  description: Numeric string; defaults to "0"
                features:
                  type: object
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                type: object
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A plan for this tier already exists (PLAN_TIER_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"

  /platform/plans/{plan_id}:
    patch:
      summary: Update a plan's name/price/features (billing_admin)
      tags: [Plans & Entitlements]
      security:
        - PlatformBearer: []
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                price_monthly: { type: string, description: Numeric string }
                features: { type: object }
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                type: object
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /platform/plans/{plan_id}/entitlements:
    put:
      summary: Replace a plan's entitlement defaults (super_admin)
      description: Every key must exist in the entitlement catalog, else 400.
      tags: [Plans & Entitlements]
      security:
        - PlatformBearer: []
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entitlements:
                  type: array
                  items:
                    type: object
                    required: [key]
                    properties:
                      key: { type: string }
                      enabled: { type: boolean, default: true }
                      limit_value: { type: [integer, "null"] }
      responses:
        "200":
          description: Updated plan entitlements
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_id: { type: integer }
                  entitlements: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /platform/organizations/{org_id}/entitlements:
    get:
      summary: Resolve effective entitlements for an organization
      description: |
        Precedence org override > org plan assignment → plan defaults > restaurant-subscription
        bridge > free default. **Resolve-only** — not enforced on operational paths yet.
      tags: [Plans & Entitlements]
      security:
        - PlatformBearer: []
      parameters:
        - $ref: "#/components/parameters/OrgIdPath"
